[tool.poetry]
name = "project-collaboration"
version = "0.1.0"
description = "Project collaboration platform — users create projects and attract participants"
authors = []
packages = [
    {include = "project_collaboration", from = "src"},
    {include = "auth", from = "src"},
    {include = "shared_kernel", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.135.3"
uvicorn = "^0.43.0"
sqlalchemy = "^2.0.49"
psycopg2-binary = "^2.9.11"
pydantic = "^2.12.5"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = "^2.12.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
