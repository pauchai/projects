# =============================================================================
# Base Docker Compose — shared service definitions.
#
# This file is never used alone. Combine with an environment overlay:
#
#   Development:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or use the helper scripts:
#   ./scripts/dev-start.sh
#   ./scripts/prod-deploy.sh
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-project_collaboration}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collab} -d ${POSTGRES_DB:-project_collaboration}"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collab_test
      POSTGRES_PASSWORD: collab_test
      POSTGRES_DB: project_collaboration_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab_test -d project_collaboration_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - test

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 100mb --maxmemory-policy noeviction --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://${POSTGRES_USER:-collab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project_collaboration}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GOOGLE_REDIRECT_URI=${OAUTH_GOOGLE_REDIRECT_URI:-}
      - OAUTH_TELEGRAM_BOT_TOKEN=${OAUTH_TELEGRAM_BOT_TOKEN:-}
      - OAUTH_TELEGRAM_BOT_USERNAME=${OAUTH_TELEGRAM_BOT_USERNAME:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram-bot
    depends_on:
      backend:
        condition: service_started
    environment:
      - PYTHONPATH=/app/src
      - BACKEND_URL=http://backend:8000
      - OAUTH_TELEGRAM_BOT_TOKEN=${OAUTH_TELEGRAM_BOT_TOKEN:-}

volumes:
  pgdata:
