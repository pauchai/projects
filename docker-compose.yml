services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 100mb --maxmemory-policy noeviction --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: project_collaboration
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d project_collaboration"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collab_test
      POSTGRES_PASSWORD: collab_test
      POSTGRES_DB: project_collaboration_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab_test -d project_collaboration_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Docker-specific overrides (hostname differs from local dev)
      - DATABASE_URL=postgresql://collab:collab@postgres:5432/project_collaboration
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://frontend:80,http://localhost:5173,http://localhost:3001
      - PYTHONPATH=/app/src
      # All other variables (JWT_*, OAUTH_*) are read from .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram-bot
    depends_on:
      backend:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      - BACKEND_URL=http://backend:8000
      - FRONTEND_URL=http://localhost:3001
      - PYTHONPATH=/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import os, httpx; r = httpx.get(f'https://api.telegram.org/bot{os.environ[\"OAUTH_TELEGRAM_BOT_TOKEN\"]}/getMe', timeout=5); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata: